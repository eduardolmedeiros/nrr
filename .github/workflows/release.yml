name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write


jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64


    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ github.ref_name }}"
          BINARY="nrr-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build \
            -trimpath \
            -ldflags "-s -w -X github.com/nrr-project/nrr/cmd.Version=${VERSION}" \
            -o "${BINARY}" \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: nrr-${{ matrix.goos }}-${{ matrix.goarch }}
          path: nrr-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  publish:
    name: Create GitHub Release
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2.6.1
        with:
          files: dist/*
          generate_release_notes: true
